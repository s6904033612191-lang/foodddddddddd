<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้ออาหาร - สั่งตามใจ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">🍳 สั่งตามใจ</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">เมนูอาหาร</a>
      <a href="admin.html">ระบบแอดมิน</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-orange);">ยืนยันรายการสั่งซื้อ</h2>
      <form id="orderForm">
        <div class="form-group">
          <label for="customerName">ชื่อผู้สั่ง *</label>
          <input type="text" id="customerName" placeholder="เช่น คุณสมชาย" required>
        </div>
        <div class="form-group">
          <label for="contact">เบอร์โทรศัพท์ / Line ID *</label>
          <input type="text" id="contact" placeholder="08x-xxx-xxxx" required>
        </div>
        <div class="form-group">
          <label for="items">เมนูอาหารที่สั่ง</label>
          <input type="text" id="items" readonly style="background: #fff3e0;">
        </div>
        <div class="form-group">
          <label for="total">ราคาครอบคลุม (บาท)</label>
          <input type="text" id="total" readonly style="background: #fff3e0;">
        </div>
        <div class="form-group">
          <label for="note">ระดับความเผ็ด / รายละเอียดเพิ่มเติม / ที่อยู่ส่ง</label>
          <textarea id="note" rows="4" placeholder="เช่น เผ็ดน้อย, ไข่ดาวไม่สุก, ส่งที่บ้านเลขที่..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">ส่งรายการสั่งอาหาร</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ร้านอาหารตามสั่งสั่งตามใจ. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
